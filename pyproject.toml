[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawyer-agents"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "基于中国法律文书的 RAG 智能法律咨询系统"
license = "MIT"
dependencies = [
    "langchain-core>=1.3,<2.0",
    "langchain>=1.2,<2.0",
    "langchain-openai>=1.2,<2.0",
    "langchain-deepseek>=1.0,<2.0",
    "langchain-community>=0.3,<0.4",
    "langchain-chroma>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "chromadb>=1.0,<2.0",
    "lancedb>=0.20,<1.0",
    "pyarrow>=15.0,<25.0",
    "jieba>=0.42,<1.0",
    "rank-bm25>=0.2,<1.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
    "sentence-transformers>=5.0,<6.0",
    "langchain-huggingface>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "docx2txt>=0.8,<1.0",
    "ragas>=0.3,<0.4",
    "datasets>=2.20,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/run.py"]

[tool.coverage.report]
fail_under = 40
show_missing = true
